<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>airportiq</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 20l10-4 6-10 3 1-3 10 8 4-1 3-9-2-3 4-2 1 0-5-5-1z' fill='%232b5cff'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f7f5; --fg:#1b1b1b; --muted:#6b6b6b; --card:#fff; --line:#e3e3df; --accent:#2b5cff; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --fg:#ececec; --muted:#9a9a9a; --card:#1e1e22; --line:#2c2c31; } }
  * { box-sizing: border-box; }
  .meta details { margin-top: 4px; } .meta summary { cursor: pointer; color: var(--muted); }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; min-height:100vh; }
  #tagline { color: var(--muted); font-size: 14px; margin-top: 2px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--muted); font-size:13px; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; white-space:pre-wrap; scroll-margin-bottom: 72px; }
  .msg.user { align-self:flex-end; max-width:85%; border-color:var(--accent); }
  .msg.bot { align-self:flex-start; max-width:92%; }
  .msg.bot.refused { border-color:var(--warn); }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; }
  form { display:flex; gap:8px; margin-top:12px; position:sticky; bottom:0; background:var(--bg); padding:8px 0; }
  input { flex:1 1 auto; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  button { flex:0 0 auto; white-space:nowrap; padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; }
  #footer { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <header><div><h1 id="title">airportiq agent</h1><div id="tagline">Capacity pressure across US hub airports</div></div><span id="status"></span></header>
  <div id="log"></div>
  <form id="f"><input id="q" autocomplete="off" placeholder="Ask a question" maxlength="2000" required><button id="send">Send</button></form>
  <p id="footer">Scores are a capacity-pressure proxy from public FAA and BTS data; weights and modelled capacity are stated assumptions, not investment advice.</p>
</main>
<script>
  const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
  let sessionId = null;
  const EXAMPLES = [
    'Which airports in New England are strong candidates for terminal expansion?',
    'Compare LA and Santa Ana airport congestion levels.',
    'What is the percentage of long haul flights out of Anchorage airport?',
    'What is the unmet flight demand in SFO airport and why?',
  ];
  q.placeholder = 'e.g. ' + EXAMPLES[Math.floor(Math.random() * EXAMPLES.length)];  // rotates per page load
  fetch('/health').then(r => r.json()).then(h => {
    document.getElementById('status').textContent = h.status === 'ok' ? '' : 'status: ' + h.status;
  }).catch(() => document.getElementById('status').textContent = 'offline');
  // Instant, synchronous, with a short retry: smooth scrolling and animation frames are unreliable on phones.
  function scrollToEnd() {
    const go = () => { const el = document.scrollingElement || document.documentElement; el.scrollTop = el.scrollHeight; };
    go(); setTimeout(go, 60); setTimeout(go, 300);
  }
  function add(cls, text, meta) {
    const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
    if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
    log.appendChild(d); scrollToEnd(); return d;
  }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault(); const message = q.value.trim(); if (!message) return;
    add('user', message); q.value = ''; send.disabled = true;
    const pending = add('bot', '…');
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: sessionId }) });
      const j = await r.json();
      if (!r.ok) { pending.textContent = j.detail || `HTTP ${r.status}`; pending.classList.add('refused'); return; }
      sessionId = j.session_id;
      pending.textContent = j.answer;
      if (j.status !== 'answered') pending.classList.add('refused');
      // Analysts see sources and limitations; model, tools, cost and latency sit behind a toggle.
      const meta = document.createElement('div'); meta.className = 'meta';
      const line = (t) => { const e = document.createElement('div'); e.textContent = t; return e; };
      if (j.status !== 'answered') meta.appendChild(line(j.status));
      if (j.sources && j.sources.length) meta.appendChild(line('Sources: ' + j.sources.join('; ')));
      const tech = [];
      if (j.served_by) tech.push(j.served_by);
      if (j.failed_attempts && j.failed_attempts.length) tech.push('fallback after: ' + j.failed_attempts.join(', '));
      if (j.tools_used && j.tools_used.length) tech.push('tools: ' + j.tools_used.join(', '));
      if (j.cost_usd) tech.push(`$${j.cost_usd.toFixed(4)}`);
      tech.push(`${j.latency_ms} ms`);
      const details = document.createElement('details'); const summary = document.createElement('summary');
      summary.textContent = 'limits and run details'; details.appendChild(summary);
      if (j.limitations && j.limitations.length) details.appendChild(line('Limitations: ' + j.limitations.join('; ')));
      details.appendChild(line(tech.join(' · ')));
      meta.appendChild(details); pending.appendChild(meta);
      scrollToEnd();
    } catch (err) { pending.textContent = 'Request failed: ' + err; pending.classList.add('refused'); scrollToEnd(); }
    finally { send.disabled = false; q.focus(); }
  });
</script>
</body>
</html>
