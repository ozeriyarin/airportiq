# Hand-kept name aliases for airports whose common names differ from the FAA city or airport name.
# Keys are FAA LIDs; values are lower-case phrases `AirportRegistry.find` accepts. Generated fields (id, IATA,
# ICAO, city, airport name) are matched automatically; this file only adds what those miss.
version: "1.0.0"
